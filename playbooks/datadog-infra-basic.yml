---
- name: Configure Datadog (Infra Basic Mode)
  hosts: dd_infra_basic
  become: true
  tags:
    - datadog
    - datadog-infra-basic

  vars_files:
    - secrets.yml

  pre_tasks:
    - name: Install extra packages (dnf)
      ansible.builtin.dnf:
        name: "{{ extra_packages }}"
        state: present
      when:
        - extra_packages is defined
        - ansible_pkg_mgr == 'dnf'

    - name: Install extra packages (apt)
      ansible.builtin.apt:
        name: "{{ extra_packages }}"
        state: present
        update_cache: true
      when:
        - extra_packages is defined
        - ansible_pkg_mgr == 'apt'

  roles:
    - role: datadog.datadog
