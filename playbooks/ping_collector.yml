---
- name: Add Datadog Ping Integration
  hosts: dd_full
  become: true
  tags:
    - datadog
    - integration
    - ping

  vars:
    ping_targets_file: "{{ playbook_dir }}/../files/ping_targets.csv"

  tasks:
    - name: Read ping targets from CSV
      community.general.read_csv:
        path: "{{ ping_targets_file }}"
      register: ping_csv
      delegate_to: localhost
      become: false
      tags:
        - configure

    - name: Display loaded ping targets
      ansible.builtin.debug:
        msg: "Loaded {{ ping_csv.list | length }} ping targets from CSV"
      tags:
        - configure

    - name: Ensure system ping utility is installed
      ansible.builtin.apt:
        name: iputils-ping
        state: present
        update_cache: true
      tags:
        - install

    - name: Install datadog-ping integration
      ansible.builtin.command:
        cmd: "sudo -u dd-agent datadog-agent integration install -t datadog-ping==1.0.2"
      become: true
      register: integration_install
      changed_when: "'installed' in integration_install.stdout"
      failed_when:
        - integration_install.rc != 0
        - "'already installed' not in integration_install.stdout"
      tags:
        - install

    - name: Ensure Datadog ping configuration directory exists
      ansible.builtin.file:
        path: /etc/datadog-agent/conf.d/ping.d
        state: directory
        owner: dd-agent
        group: dd-agent
        mode: '0755'
      tags:
        - configure

    - name: Configure Ping Check from CSV targets
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/ping.yaml.j2"
        dest: /etc/datadog-agent/conf.d/ping.d/conf.yaml
        owner: dd-agent
        group: dd-agent
        mode: '0640'
      vars:
        ping_targets: "{{ ping_csv.list }}"
      notify: Restart Datadog Agent
      tags:
        - configure

  handlers:
    - name: Restart Datadog Agent
      ansible.builtin.service:
        name: datadog-agent
        state: restarted
