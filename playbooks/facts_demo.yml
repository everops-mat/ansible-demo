---
- name: Facts-Based Configuration Demo
  hosts: demo_nodes
  become: true
  gather_facts: true
  tags:
    - facts
    - demo

  tasks:
    # Display gathered facts
    - name: Display key system facts
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Architecture: {{ ansible_architecture }}"
          - "CPUs: {{ ansible_processor_vcpus }}"
          - "Memory: {{ ansible_memtotal_mb }} MB"
          - "IPv4: {{ ansible_default_ipv4.address | default('N/A') }}"
      tags:
        - info

    # Classify hosts based on resources
    - name: Set host classification based on memory
      ansible.builtin.set_fact:
        host_class: >-
          {%- if ansible_memtotal_mb >= 4096 -%}
            large
          {%- elif ansible_memtotal_mb >= 2048 -%}
            medium
          {%- else -%}
            small
          {%- endif -%}
      tags:
        - classify

    - name: Display host classification
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} classified as: {{ host_class }}"
      tags:
        - classify

    # Generate dynamic tags based on facts
    - name: Build dynamic Datadog tags from facts
      ansible.builtin.set_fact:
        dynamic_dd_tags:
          - "os:{{ ansible_distribution | lower }}"
          - "os_version:{{ ansible_distribution_version }}"
          - "arch:{{ ansible_architecture }}"
          - "memory_class:{{ host_class }}"
          - "cpus:{{ ansible_processor_vcpus }}"
          - "kernel:{{ ansible_kernel }}"
      tags:
        - tags

    - name: Display generated tags
      ansible.builtin.debug:
        msg: "Dynamic tags for {{ inventory_hostname }}: {{ dynamic_dd_tags }}"
      tags:
        - tags

    # Conditional task execution based on facts
    - name: Install htop on systems with enough memory
      ansible.builtin.apt:
        name: htop
        state: present
      when: ansible_memtotal_mb >= 512
      tags:
        - packages
        - conditional

    - name: Skip heavy monitoring on small instances
      ansible.builtin.debug:
        msg: "Skipping heavy monitoring - system has only {{ ansible_memtotal_mb }}MB RAM"
      when: ansible_memtotal_mb < 1024
      tags:
        - conditional

    # Generate a facts report file
    - name: Create system facts report
      ansible.builtin.copy:
        content: |
          # System Facts Report for {{ ansible_hostname }}
          # Generated by Ansible on {{ ansible_date_time.iso8601 }}

          ## System Information
          - Hostname: {{ ansible_hostname }}
          - FQDN: {{ ansible_fqdn }}
          - OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          - Kernel: {{ ansible_kernel }}
          - Architecture: {{ ansible_architecture }}

          ## Hardware
          - CPUs: {{ ansible_processor_vcpus }}
          - Memory: {{ ansible_memtotal_mb }} MB
          - Swap: {{ ansible_swaptotal_mb }} MB

          ## Network
          - Default IPv4: {{ ansible_default_ipv4.address | default('N/A') }}
          - Default Interface: {{ ansible_default_ipv4.interface | default('N/A') }}

          ## Classification
          - Host Class: {{ host_class }}
          - Dynamic Tags: {{ dynamic_dd_tags | join(', ') }}
        dest: /tmp/system_facts_report.md
        mode: '0644'
      tags:
        - report

    - name: Fetch facts report to control machine
      ansible.builtin.fetch:
        src: /tmp/system_facts_report.md
        dest: "{{ playbook_dir }}/../reports/{{ inventory_hostname }}_facts.md"
        flat: yes
      tags:
        - report
