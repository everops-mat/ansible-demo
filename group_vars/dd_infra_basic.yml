---
# Datadog infra basic installation config
# Infrastructure metrics + APM only (logs disabled for demo)

datadog_config:
  logs_enabled: false
  apm_config:
    enabled: false
  process_config:
    process_collection:
      enabled: false
  tags:
    - "env:vagrant_demo"
    - "role:web_node"
    - "mode:infra_basic"
    - "infra_basic_host:true"

# No extra integrations - just default system metrics
datadog_checks: {}
